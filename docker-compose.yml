name: ev-analytics-hub

services:
  postgres:
    image: postgres:16-alpine
    container_name: ev-postgres
    environment:
      POSTGRES_DB: ev_analytics
      POSTGRES_USER: ev
      POSTGRES_PASSWORD: ev_local_only
    ports:
      - "5432:5432"
    volumes:
      - ev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ev -d ev_analytics"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ev_pgdata:
